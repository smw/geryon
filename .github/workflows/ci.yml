name: CI

# Every push and pull request: run the tests against a real crawl build, build
# the release archives, and build the Docker image.
#
# Pushes to main also publish the image as ghcr.io/<repo>:edge. A tag starting
# with "v" publishes it as :<tag> and :latest, and publishes the archives as a
# GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version stamped into the binary

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting and vet
        run: make check

      # The integration tests play real games, so they need crawl. It is built
      # from the commit named in CRAWL_VERSION, which takes a while, so the
      # result is cached.
      - name: Read the crawl version
        id: crawl
        run: echo "sha=$(tr -d '[:space:]' < CRAWL_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install crawl's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex pkg-config python3-yaml advancecomp \
            libncursesw5-dev liblua5.4-dev libsqlite3-dev libz-dev libpng-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libfreetype6-dev

      - name: Restore the crawl build
        id: crawl-cache
        uses: actions/cache@v4
        with:
          path: crawl
          key: crawl-${{ runner.os }}-${{ runner.arch }}-${{ steps.crawl.outputs.sha }}-v1

      - name: Build crawl
        if: steps.crawl-cache.outputs.cache-hit != 'true'
        run: |
          # All history, without file contents: crawl's version comes from `git describe`.
          git clone --filter=blob:none --no-checkout https://github.com/crawl/crawl.git crawl
          git -C crawl checkout --detach "${{ steps.crawl.outputs.sha }}"
          # Crawl's Makefile cannot build rltiles/status-icon-sizes.js on demand
          # (the rule's target name lacks a slash), so a parallel build stops at
          # "No rule to make target" unless the file already exists. Generate
          # it first, under either spelling of the target.
          src=crawl/crawl-ref/source
          make -C "$src" WEBTILES=y rltilesstatus-icon-sizes.h \
            || make -C "$src" WEBTILES=y rltiles/status-icon-sizes.h || true
          if ! make -C "$src" -j"$(nproc)" WEBTILES=y > crawl-build.log 2>&1; then
            tail -n 60 crawl-build.log
            # Job logs need a login to read; annotations do not.
            grep -E '(\*\*\*|[Ee]rror)' crawl-build.log | tail -n 8 | while IFS= read -r line; do
              echo "::error title=crawl build::$line"
            done
            exit 1
          fi
          # Only the built tree is needed from here on.
          rm -rf crawl/.git
          find crawl \( -name '*.o' -o -name '*.d' \) -delete

      - name: Test
        run: make test CRAWL_SOURCE=crawl/crawl-ref/source

      - name: Build release archives
        run: |
          version=$(git describe --tags --always)
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o dist/geryon ./cmd/geryon
            tar -C dist -czf "dist/geryon-$version-linux-$arch.tar.gz" geryon -C .. README.md
            rm dist/geryon
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: geryon
          path: dist/
          if-no-files-found: error

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the image
        run: docker build --build-arg VERSION="$(git describe --tags --always)" -t geryon .

      - name: Check the image starts
        run: docker run --rm --entrypoint geryon geryon -version

      - name: Publish the image
        if: github.event_name == 'push'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$GITHUB_REF_NAME latest"; else tags=edge; fi
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in $tags; do
            docker tag geryon "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    if: github.ref_type == 'tag'
    needs: [build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geryon
          path: dist
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
